name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint once (OS-independent).
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Test on three operating systems (one default arch each).
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test CLI
        shell: bash
        run: |
          cargo run --release --quiet -- --version
          # ASCII file -> utf-8, confidence 1 (certain). Use a relative path
          # (not /tmp) so the native Windows binary resolves it like bash does.
          printf 'hello ascii\n' > smoke.txt
          out="$(cargo run --release --quiet -- smoke.txt)"
          echo "$out"
          echo "$out" | grep -q '^utf-8	1	smoke.txt$'
          # stdin content -> path `-`
          printf '\xef\xbb\xbfbom utf8' | cargo run --release --quiet -- | grep -q '^utf-8	1	-$'
          # --files-from reads a path list (newline- and NUL-separated)
          printf 'smoke.txt\n' | cargo run --release --quiet -- --files-from - | grep -q '^utf-8	1	smoke.txt$'
          printf 'smoke.txt\0' | cargo run --release --quiet -- --files-from - -0 | grep -q '^utf-8	1	smoke.txt$'
          rm -f smoke.txt
