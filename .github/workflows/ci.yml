name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test CLI
        run: |
          ./target/release/chardet --version
          # ASCII file -> utf-8, confidence 1 (certain)
          printf 'hello ascii\n' > /tmp/smoke.txt
          out="$(./target/release/chardet /tmp/smoke.txt)"
          echo "$out"
          echo "$out" | grep -q '^utf-8	1	/tmp/smoke.txt$'
          # stdin content -> path `-`
          printf '\xef\xbb\xbfbom utf8' | ./target/release/chardet | grep -q '^utf-8	1	-$'
          # --files-from reads a path list (newline- and NUL-separated)
          printf '/tmp/smoke.txt\n' | ./target/release/chardet --files-from - | grep -q '^utf-8	1	/tmp/smoke.txt$'
          printf '/tmp/smoke.txt\0' | ./target/release/chardet --files-from - -0 | grep -q '^utf-8	1	/tmp/smoke.txt$'
